<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Hardcoded on purpose: the browser tab must read "Polina Lee" on every
         page, so this is NOT "{{ page.title }} | {{ site.title }}". -->
    <title>Polina Lee</title>

    <meta name="description" content="{{ site.description | strip_newlines | strip }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  </head>

  <body class="{{ page.body_class }}">

    <header class="site-header" role="banner">
      <nav class="site-nav">
        <a class="page-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="page-link{% if page.url contains '/projects' %} active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>
        <a class="page-link{% if page.url contains '/methods' %} active{% endif %}" href="{{ '/methods/' | relative_url }}">Methods</a>
      </nav>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <!-- TODO: add href="mailto:..." to the Email button.
           No `download` attribute on the resume on purpose — it opens in the
           browser's PDF viewer, which has its own download control. -->
      <div class="footer-buttons">
        <a class="footer-btn" href="https://www.linkedin.com/in/polina-lee">LinkedIn</a>
        <a class="footer-btn" href="https://orcid.org/0009-0008-2523-4328">ORCID</a>
        <a class="footer-btn" href="{{ '/assets/PolinaLee_BME_UTAustin_Senior2027.pdf' | relative_url }}"
           target="_blank" rel="noopener">View Resume PDF</a>
        <span class="footer-btn">Email</span>
      </div>
    </footer>

  </body>

</html>
