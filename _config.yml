title: Polina Lee
description: >-
  Biomedical engineering — electrochemical and optical sensing for
  point-of-care diagnostics in emergency and low-resource settings.
theme: minima

# Nav is hardcoded in _layouts/default.html now (Home / Projects / Methods,
# centered), so header_pages is no longer read. github_username is gone —
# the custom footer replaces minima's social links.

plugins:
  - jekyll-feed

# Setting `exclude` REPLACES Jekyll's defaults rather than adding to them, so
# the Gemfile entries have to be restored by hand — otherwise they get copied
# into _site and served at /Gemfile.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
